services:
  db:
    image: postgres:15-alpine
    container_name: facturacion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facturacion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facturacion_pass}
      POSTGRES_DB: ${POSTGRES_DB:-facturacion_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facturacion_user} -d ${POSTGRES_DB:-facturacion_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturacion_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facturacion_user}:${POSTGRES_PASSWORD:-facturacion_pass}@db:5432/${POSTGRES_DB:-facturacion_db}
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_por_una_clave_segura}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # hot reload en desarrollo

volumes:
  postgres_data:
    driver: local
